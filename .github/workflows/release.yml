name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Rebuild native modules (Windows)
      if: matrix.os == 'windows-latest'
      run: npm rebuild @tailwindcss/oxide
      
    - name: Run optimization checks
      run: node scripts/optimize-for-low-ram.js
      
    - name: Build application
      run: npm run build
      
    - name: Auto-increment version
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: npm version patch --no-git-tag-version
      
    - name: Build and release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run dist
      
    - name: Upload Windows artifacts
      if: matrix.os == 'windows-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: |
          release/**/*.exe
          release/**/*.yml
          release/**/*.blockmap
          
    - name: Upload macOS artifacts
      if: matrix.os == 'macos-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: macos-release
        path: |
          release/**/*.dmg
          release/**/*.yml
          release/**/*.blockmap